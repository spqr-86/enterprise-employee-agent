[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_employee_agent"]

[project]
name = "enterprise-employee-agent"
version = "0.1.0"
description = "A grounded HR assistant with a typed leave-of-absence workflow."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.11,<3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0,<7",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<0.13",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "smoke: fast offline checks of the assembled application path",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
